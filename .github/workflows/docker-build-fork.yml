# Builds this fork's Docker image and pushes it to ghcr.io/macintoshme/audiobookshelf.
#
# Separate file from the upstream docker-build.yml so syncing with advplyr/audiobookshelf
# never conflicts, and so the upstream job guard (github.repository == 'advplyr/audiobookshelf')
# still keeps the upstream workflow inert here.
#
# Uses the built-in GITHUB_TOKEN, so no secrets are required.

---
name: Build and Push Fork Docker Image

on:
  push:
    branches: [master]
    # Only build when files relevant to the image have changed
    paths:
      - client/**
      - server/**
      - index.js
      - package.json
      - tsconfig.server.json
      - Dockerfile
      - .github/workflows/docker-build-fork.yml
  # Allows you to run workflow manually from Actions tab
  workflow_dispatch:
    inputs:
      tags:
        description: 'Docker Tag (overrides auto tags)'
        required: true
        default: 'latest'

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-build-fork
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, 'skip ci') }}
    runs-on: ubuntu-24.04

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/macintoshme/audiobookshelf
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=edge,branch=master

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-fork-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-fork-

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          tags: ${{ github.event.inputs.tags || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
